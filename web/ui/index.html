<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paleonix</title>
    <!-- Landing-page display faces: Cinzel (inscription headings), Crimson Pro
         (italic body), Space Mono (taxonomic labels & data). Preconnect first so
         the font CSS/woff2 fetches start as early as possible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts the entire application into this single empty div.
         This is the "single-page app" model: the server sends one HTML
         shell, and JavaScript renders everything else on the client. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
